# Optional: Render Blueprint — correct start command for this Django project.
# Deploy: Dashboard → New → Blueprint → connect repo, or paste this file.
# Start command runs migrate + optional fixture load so you don't need Render Shell (free tier).
services:
  - type: web
    name: waywithyou
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py load_initial_data && gunicorn HandyRides.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.14"
      - key: DEBUG
        value: "False"
      # Add DATABASE_URL in the dashboard (from your Postgres Internal URL).
